name: Checks
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q src app.py launch.py scripts

  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - uses: actions/cache@v4
        with:
          path: runtime/models
          key: minilm-fastembed-0.7.3-${{ runner.os }}
      - run: python -m scripts.evaluate --output evaluation/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: evaluation/ci-results.json
